<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create Account - ESG Stock Prediction System">
    <title>Create Account - ESG Stock Prediction System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📈</text></svg>">
</head>
<body>

    <div id="particle-canvas"></div>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <a href="{{ url_for('index') }}">
                        <i class="bi bi-graph-up-arrow"></i>
                        <span>ESG Predict</span>
                    </a>
                </div>

                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Join ESG Stock Prediction System</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="auth-alert auth-alert-{{ category }}">
                                <i class="bi bi-{% if category == 'error' %}exclamation-circle{% elif category == 'success' %}check-circle{% else %}info-circle{% endif %}"></i>
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('register') }}" novalidate>
                    <div class="form-group">
                        <label for="full_name">Full Name</label>
                        <input type="text" id="full_name" name="full_name" class="form-control"
                               placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="company_name">Company Name <small class="text-muted">(optional)</small></label>
                        <input type="text" id="company_name" name="company_name" class="form-control"
                               placeholder="Your Company Ltd.">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" class="form-control"
                                   placeholder="Minimum 6 characters" required>
                            <button type="button" class="password-toggle" id="passwordToggle"
                                    onclick="togglePassword('password', 'passwordIcon')" aria-label="Toggle password visibility">
                                <i class="bi bi-eye" id="passwordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                                   placeholder="Re-enter your password" required>
                            <button type="button" class="password-toggle" id="confirmToggle"
                                    onclick="togglePassword('confirm_password', 'confirmIcon')" aria-label="Toggle confirm password visibility">
                                <i class="bi bi-eye" id="confirmIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn auth-btn-primary mt-3">
                        <i class="bi bi-person-plus"></i> Create Account
                    </button>
                </form>

                <div class="auth-divider">or</div>

                <div class="auth-footer">
                    Already have an account?
                    <a href="{{ url_for('login') }}">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(r){r.unregister()})}).catch(function(){});</script>
    <script src="{{ url_for('static', filename='js/main.js')}}?v={{ static_version() }}"></script>
    <script>
        function togglePassword(inputId, iconId) {
            var input = document.getElementById(inputId);
            var icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>

</body>
</html>
