<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - ESG Stock Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div id="particle-canvas"></div>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card" style="text-align: center; padding: 48px 36px;">
                <div class="auth-logo" style="margin-bottom: 24px;">
                    <a href="{{ url_for('index') }}">
                        <i class="bi bi-shield-check"></i>
                        <span>ESG Predict</span>
                    </a>
                </div>

                <div style="font-size: 72px; margin-bottom: 16px; line-height: 1;">
                    {% if success %}✅{% else %}❌{% endif %}
                </div>

                <h2 class="auth-title" style="font-size: 24px; margin-bottom: 8px;">
                    {% if success %}Email Verified!{% else %}Verification Failed{% endif %}
                </h2>

                <p style="color: #b0bec5; font-size: 15px; line-height: 1.6; margin-bottom: 24px;">
                    {{ message }}
                </p>

                <div style="margin-top: 24px;">
                    <a href="{{ url_for('login') }}" class="auth-btn auth-btn-primary" style="text-decoration: none; display: inline-block;">
                        <i class="bi bi-box-arrow-in-right"></i> Go to Login
                    </a>
                </div>

                {% if not success %}
                <div class="auth-footer" style="margin-top: 16px;">
                    Need help?
                    <a href="{{ url_for('register') }}">Register again</a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(r){r.unregister()})}).catch(function(){});</script>
    <script src="{{ url_for('static', filename='js/main.js')}}?v={{ static_version() }}"></script>
</body>
</html>
